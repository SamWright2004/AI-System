name: personal-ai

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: personal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_ai
      POSTGRES_USER: personal_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-personal_ai_dev}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # PostgreSQL 18 stores versioned data beneath /var/lib/postgresql.
      - personal_ai_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_ai -d personal_ai"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  personal_ai_postgres:
    name: personal-ai-postgres-data
