name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: personal_ai_test
          POSTGRES_USER: personal_ai
          POSTGRES_PASSWORD: personal_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_ai -d personal_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://personal_ai:personal_ai_test@127.0.0.1:5432/personal_ai_test
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://personal_ai:personal_ai_test@127.0.0.1:5432/personal_ai_test
